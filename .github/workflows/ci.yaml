name: CI

on:
  push:
  release:
    types:
      - published
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: "Upload artifacts"
        type: boolean
        required: true
        default: true
      run_hydra:
        description: "Include the Hydra tests"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event.inputs.run_hydra == 'true') && 'full' || 'regular' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  IMAGE: ghcr.io/blockfrost/blockfrost-platform
  # Our self-hosted runner is a systemd service, so child processes inherit
  # JOURNAL_STREAM. Clear it so that CI logs use the default colored format
  # instead of syslog priority prefixes meant for journald.
  JOURNAL_STREAM: ""

jobs:
  check_action_pins:
    name: Check third-party actions are SHA-pinned
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Verify SHA pins
        run: .github/check-action-pins.sh

  check_flake_lock:
    name: Check flake.lock is up to date
    runs-on: [self-hosted, Linux, X64, nixos]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # if this fails, it means that flake.nix inputs
      # were changed but flake.lock was not updated
      # in which case running `nix flake lock` should fix it
      # `nix flake show` also works
      - name: Assert flake.lock is up to date
        run: nix flake lock --no-update-lock-file

  static_checks:
    name: Static checks
    needs: [check_action_pins]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Block Fixup Commit Merge
        if: github.event_name == 'pull_request'
        uses: 13rac1/block-fixup-merge-action@bd5504fb9ca0253e109d98eb86b7debc01970cdc # v2.0.0
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: static-checks
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint with Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Ensure crate deps use workspace versions
        run: |
          found=$(find crates -type f -name Cargo.toml -exec grep -nH -E '= ".?[0-9]' {} +) || true
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::All dependency versions must be defined in the root [workspace.dependencies]"
            exit 1
          fi

  build:
    name: Build and Test
    needs: [check_action_pins, static_checks]
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
      fail-fast: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, rust-src, clippy
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build-and-test
          key: ${{ matrix.rust }}

      - name: Install libpq (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq
          brew link --force libpq
          echo "LIBRARY_PATH=$(brew --prefix libpq)/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix libpq)/include:$CPATH" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Set up libpq (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pgDir = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory |
                   Sort-Object Name -Descending |
                   Select-Object -First 1
          if (-not $pgDir) { throw "PostgreSQL installation not found" }
          $pg = $pgDir.FullName
          "PQ_LIB_DIR=$pg\lib"          >> $env:GITHUB_ENV
          "LIB=$pg\lib;$env:LIB"        >> $env:GITHUB_ENV
          "INCLUDE=$pg\include;$env:INCLUDE" >> $env:GITHUB_ENV
          "PATH=$pg\bin;$env:PATH"       >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --workspace --release --verbose

      # On Linux, unit tests run with coverage in the `unit_tests` job
      - name: Test
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: cargo test --workspace --lib --verbose

      - name: Package binaries
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_artifacts == 'true'
        run: |
          mkdir -p artifacts
          cp target/release/blockfrost-platform* artifacts/

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-binary
          path: artifacts/

  unit_tests:
    name: Unit Tests
    runs-on: [self-hosted, Linux, X64, nixos]
    needs: [check_flake_lock, static_checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Do a test of the coverage tools
        run: nix build -L --no-link .#checks.x86_64-linux.coverage-tools

      - name: Run unit tests with coverage
        id: test
        timeout-minutes: 10
        run: nix run -L .#internal.x86_64-linux.coverage-unit-tests

      - name: Upload coverage
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-input-unit
          path: unit.lcov
          if-no-files-found: ${{ steps.test.outcome == 'success' && 'error' || 'warn' }}
          overwrite: true

  platform_integration_tests:
    name: Platform Integration Tests
    runs-on: [self-hosted, Linux, X64, nixos]
    needs: [check_flake_lock, static_checks]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Integration Tests
        id: test
        timeout-minutes: 10
        env:
          CARDANO_NODE_SOCKET_PATH: /run/cardano-node/node_preview.socket
          BLOCKFROST_PREVIEW_PROJECT_ID: ${{ secrets.BLOCKFROST_PREVIEW_PROJECT_ID }}
          DATA_NODE_ENDPOINT: http://127.0.0.1:3010
        run: nix run -L .#internal.x86_64-linux.coverage-platform-integ-tests

      - name: Upload coverage
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-input-platform-integ
          path: platform-integ.lcov
          if-no-files-found: ${{ steps.test.outcome == 'success' && 'error' || 'warn' }}
          overwrite: true

  blockfrost_integration_tests:
    name: >-
      ${{ matrix.mode == 'ignore-check' && 'Ignored'
       || 'Tests' }} (${{ matrix.network }})
    runs-on: [self-hosted, Linux, X64, nixos]
    needs: [check_flake_lock, static_checks]
    strategy:
      fail-fast: false
      matrix:
        network: [preview, preprod, mainnet]
        mode: [tests, ignore-check]
        include:
          - network: preview
            data_node_endpoint: http://127.0.0.1:3010
            cardano_node_socket_path: /run/cardano-node/node_preview.socket
            project_id_secret: BLOCKFROST_PREVIEW_PROJECT_ID
            submit_mnemonic_secret: BLOCKFROST_PREVIEW_SUBMIT_MNEMONIC
          - network: preprod
            data_node_endpoint: http://127.0.0.1:3009
            cardano_node_socket_path: /run/cardano-node/node_preprod.socket
            project_id_secret: BLOCKFROST_PREPROD_PROJECT_ID
            submit_mnemonic_secret: BLOCKFROST_PREPROD_SUBMIT_MNEMONIC
          - network: mainnet
            data_node_endpoint: http://127.0.0.1:3008
            cardano_node_socket_path: /run/cardano-node/node_mainnet.socket
            project_id_secret: BLOCKFROST_MAINNET_PROJECT_ID
            submit_mnemonic_secret: BLOCKFROST_MAINNET_SUBMIT_MNEMONIC
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: ${{ matrix.mode == 'ignore-check' && 'Check ignored tests still fail' || 'Run Blockfrost Tests' }}
        id: run_tests
        timeout-minutes: 15
        env:
          PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
          SUBMIT_MNEMONIC: ${{ secrets[matrix.submit_mnemonic_secret] }}
          DATA_NODE_ENDPOINT: ${{ matrix.data_node_endpoint }}
          CARDANO_NODE_SOCKET_PATH: ${{ matrix.cardano_node_socket_path }}
          LLVM_PROFILE_FILE: ${{ github.workspace }}/blockfrost-${{ matrix.network }}-%p-%m.profraw
        run: |
          target=${{ matrix.mode == 'ignore-check' && 'blockfrost-ignore-check' || 'coverage-blockfrost-tests' }}
          nix run -L .#internal.x86_64-linux."${target}-${{ matrix.network }}"

      - name: Convert profraw to LCOV
        id: convert
        if: ${{ !cancelled() && matrix.mode != 'ignore-check' && (steps.run_tests.outcome == 'success' || steps.run_tests.outcome == 'failure') }}
        run: nix run -L .#internal.x86_64-linux.coverage-convert-blockfrost-${{ matrix.network }}

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.mode != 'ignore-check' && steps.convert.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-input-blockfrost-${{ matrix.network }}
          path: blockfrost-${{ matrix.network }}.lcov
          if-no-files-found: error
          overwrite: true

  hydra_tests:
    name: ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64, nixos]
    needs: [check_flake_lock, static_checks]
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run_hydra == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Hydra tests of their `--blockfrost` option
            run_target: hydra-test
            timeout_minutes: 15
            profraw_prefix: ""
            convert_target: ""
            lcov_file: ""
            artifact_name: ""
          - name: Hydra micropayments tests between Platform↔Gateway
            run_target: coverage-hydra-platform-gateway-test
            timeout_minutes: 60
            profraw_prefix: hydra-pg
            convert_target: coverage-convert-hydra-pg
            lcov_file: hydra-platform-gateway.lcov
            artifact_name: coverage-input-hydra-platform-gateway
          - name: Hydra micropayments tests between Bridge↔Gateway
            run_target: coverage-hydra-bridge-gateway-test
            timeout_minutes: 60
            profraw_prefix: hydra-bg
            convert_target: coverage-convert-hydra-bg
            lcov_file: hydra-bridge-gateway.lcov
            artifact_name: coverage-input-hydra-bridge-gateway
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run Hydra Tests
        id: run_tests
        timeout-minutes: ${{ matrix.timeout_minutes }}
        env:
          CARDANO_NODE_SOCKET_PATH: /run/cardano-node/node_preview.socket
          BLOCKFROST_PROJECT_ID: ${{ secrets.BLOCKFROST_TESTS_PROJECT_ID }}
          SUBMIT_MNEMONIC: ${{ secrets.BLOCKFROST_TESTS_SUBMIT_MNEMONIC }}
          LLVM_PROFILE_FILE: ${{ matrix.profraw_prefix != '' && format('{0}/{1}-%p-%m.profraw', github.workspace, matrix.profraw_prefix) || '' }}
        run: nix run -L .#internal.x86_64-linux.${{ matrix.run_target }}

      - name: Convert profraw to LCOV
        id: convert
        if: ${{ !cancelled() && matrix.convert_target != '' && (steps.run_tests.outcome == 'success' || steps.run_tests.outcome == 'failure') }}
        run: nix run -L .#internal.x86_64-linux.${{ matrix.convert_target }}

      - name: Upload coverage
        if: ${{ !cancelled() && matrix.artifact_name != '' && steps.convert.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.lcov_file }}
          if-no-files-found: error
          overwrite: true

  oci_build:
    name: OCI Build (${{ matrix.arch }})
    needs: [check_action_pins]
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (+ push if needed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # Always load into the local Docker daemon for smoke test below
          load: true
          push: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.action == 'published') }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Prevent the `unknown/unknown` architecture in the GitHub UI:
          provenance: false
          sbom: false

      - name: Smoke test run with --version
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}" --version

  oci_merge:
    name: Create multi-arch manifests
    runs-on: ubuntu-latest
    needs: [oci_build]
    if: ${{ github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.action == 'published')) }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifests (single publish)
        shell: bash
        run: |
          set -euo pipefail

          amd="${IMAGE}:${{ github.sha }}-amd64"
          arm="${IMAGE}:${{ github.sha }}-arm64"
          args=()

          # commit SHA (multi-arch)
          args+=(-t "${IMAGE}:${{ github.sha }}")

          # `edge` on `main` and on releases
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.event_name }}" == "release" ]]; then
            args+=(-t "${IMAGE}:edge")
          fi

          # release tag and `latest`
          if [[ "${{ github.event_name }}" == "release" ]]; then
            args+=(-t "${IMAGE}:${{ github.event.release.tag_name }}")

            if [[ "${{ github.event.release.prerelease }}" != "true" ]]; then
              args+=(-t "${IMAGE}:latest")
            fi
          fi

          set -x
          docker buildx imagetools create "${args[@]}" "${amd}" "${arm}"

  coverage_report:
    name: Coverage Report
    runs-on: [self-hosted, Linux, X64, nixos]
    # If some test jobs fail, this job still makes a report. If GitHub skips
    # all regular test jobs, this job does not start. For example, this
    # occurs when `static_checks` fails. Then there are no LCOV files to merge.
    if: >-
      ${{ !cancelled() &&
          (needs.unit_tests.result != 'skipped' ||
           needs.platform_integration_tests.result != 'skipped' ||
           needs.blockfrost_integration_tests.result != 'skipped') }}
    needs:
      - unit_tests
      - platform_integration_tests
      - blockfrost_integration_tests
      - hydra_tests
    env:
      LINE_THRESHOLD_REGULAR: 52
      LINE_THRESHOLD_HYDRA: 78
      HYDRA_ENABLED: ${{ github.event_name == 'schedule' || github.event.inputs.run_hydra == 'true' }}
      UNIT_RESULT: ${{ needs.unit_tests.result }}
      PLATFORM_RESULT: ${{ needs.platform_integration_tests.result }}
      BLOCKFROST_RESULT: ${{ needs.blockfrost_integration_tests.result }}
      HYDRA_RESULT: ${{ needs.hydra_tests.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-input-*
          path: coverage-inputs

      - name: Generate coverage report
        id: report
        run: |
          expected_paths=(
            coverage-inputs/coverage-input-unit/unit.lcov
            coverage-inputs/coverage-input-platform-integ/platform-integ.lcov
            coverage-inputs/coverage-input-blockfrost-preview/blockfrost-preview.lcov
            coverage-inputs/coverage-input-blockfrost-preprod/blockfrost-preprod.lcov
            coverage-inputs/coverage-input-blockfrost-mainnet/blockfrost-mainnet.lcov
          )
          if [ "$HYDRA_ENABLED" = true ]; then
            expected_paths+=(
              coverage-inputs/coverage-input-hydra-platform-gateway/hydra-platform-gateway.lcov
              coverage-inputs/coverage-input-hydra-bridge-gateway/hydra-bridge-gateway.lcov
            )
          fi

          required_ok=true
          for r in "$UNIT_RESULT" "$PLATFORM_RESULT" "$BLOCKFROST_RESULT"; do
            [ "$r" = success ] || required_ok=false
          done
          if [ "$HYDRA_ENABLED" = true ]; then
            [ "$HYDRA_RESULT" = success ] || required_ok=false
          fi

          shopt -s nullglob
          found_files=(coverage-inputs/*/*.lcov)
          shopt -u nullglob
          echo "Found ${#found_files[@]} coverage input file(s). A complete run expects ${#expected_paths[@]} file(s)."

          if [ "$required_ok" = true ]; then
            missing=()
            for p in "${expected_paths[@]}"; do
              [ -f "$p" ] || missing+=("$p")
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "::error::All required jobs passed, but these coverage input file(s) are missing: ${missing[*]}" >&2
              exit 1
            fi
            unexpected=()
            for f in "${found_files[@]}"; do
              match=false
              for p in "${expected_paths[@]}"; do
                [ "$f" = "$p" ] && match=true && break
              done
              [ "$match" = true ] || unexpected+=("$f")
            done
            if [ "${#unexpected[@]}" -gt 0 ]; then
              echo "::error::Found unexpected coverage input file(s): ${unexpected[*]}" >&2
              exit 1
            fi
            lcov_files=("${expected_paths[@]}")
            threshold=$([ "$HYDRA_ENABLED" = true ] && echo "$LINE_THRESHOLD_HYDRA" || echo "$LINE_THRESHOLD_REGULAR")
          else
            lcov_files=("${found_files[@]}")
            if [ "${#lcov_files[@]}" -eq 0 ]; then
              echo "::notice::One or more required jobs did not pass. There are no coverage input files. This job will not make a report."
              exit 0
            fi
            threshold=0
            echo "One or more required jobs did not pass. This job makes a diagnostic report from ${#lcov_files[@]} coverage input file(s), with threshold 0."
          fi

          status=0
          nix run -L .#internal.x86_64-linux.coverage-report -- --threshold "$threshold" "${lcov_files[@]}" || status=$?
          if [ -f coverage-html/index.html ]; then
            echo "html=true" >>"$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload HTML report
        if: ${{ !cancelled() && steps.report.outputs.html == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-html/
          if-no-files-found: error
          overwrite: true
